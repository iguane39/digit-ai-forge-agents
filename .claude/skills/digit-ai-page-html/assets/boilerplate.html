<!DOCTYPE html>
<html lang="fr">
<head>
<!-- S-G1 (1/4, R-30 amendé TF-0158 le 13/08) — initialisation AVANT le <style> : pose
     data-theme avant la première peinture (zéro flash). CLAIR PAR DÉFAUT, STRICTEMENT :
     un livrable circule et s'ouvre identique chez tous ses lecteurs — l'auto-sombre
     hérité de l'OS (prefers-color-scheme) est retiré (il a valu un retour humain réel
     le 13/08 : « thème sombre par défaut »). Le sombre reste un CHOIX du lecteur,
     persisté. Volontairement SANS defer/async : un script différé peindrait d'abord le
     thème par défaut du CSS puis re-peindrait, c'est le flash que ce script évite
     (déclenche le WARN générique « script bloquant en head » de check_html.py —
     exception assumée, documentée ici). -->
<script>
(function () {
  var stocke = null;
  try { stocke = localStorage.getItem('digitai-theme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme',
    stocke === 'dark' ? 'dark' : 'light');
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit-AI — {Objet} · {Client}</title>
  <meta name="description" content="{Résumé clair du livrable en une phrase.}">
  <meta name="theme-color" content="#2563EB">
  <meta name="color-scheme" content="light dark">
  <!-- Favicon-lettre (systématisation du 13/08, loi transverse n°3 : la surface implicite
       se propose d'office) : remplacer {L} par la PREMIÈRE LETTRE du client ou du projet. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Roboto,sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'%3E{L}%3C/text%3E%3C/svg%3E">

  <!-- Polices : AUCUN chargement réseau (A1/D-10 — confidentialité, durabilité,
       lecture hors ligne). Roboto/DM Sans s'affichent si installées localement,
       sinon les replis système des tokens --head/--sans/--mono prennent le relais. -->

  <style>
    :root {
      /* Couleurs — marque & surfaces */
      --blue: #2563EB;
      --bg: #FAFBFF;
      --surface: #FFFFFF;
      --card: #FFFFFF;
      /* Couleurs — encres */
      --ink: #0F172A;
      --muted: #64748B;
      --faint: #94A3B8;
      --line: #E6EAF2;
      /* Accents sémantiques */
      --amber: #D97706; --amber-fill: #FFFBEB; --amber-line: #FDE9C8;
      --teal:  #0E9488; --teal-fill:  #EFFDFB; --teal-line:  #C7F0EA;
      --green: #15803D; --green-fill: #F2FCF5; --green-line: #CFEEDD;
      /* Rayons */
      --r: 12px; --r-sm: 8px;
      /* Largeur du conteneur et largeur de lecture — cf. regle L2.
         Le conteneur occupe 75-100 % de la fenetre A TOUTE TAILLE (decision 13/08) :
         92vw sous ~1826px, plafond confort 1680px, plancher 75vw au-dela. */
      --w: clamp(75vw, 1680px, 92vw); --prose: 75ch;
      /* Familles (repli système obligatoire) */
      --head: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "Consolas", monospace;
      /* Année de référence (token isolé) */
      --annee-ref: "2026";
    }

    /* S-G1 (2/4, R-30) — tokens sombres : une source, deux projections. bg/surface
       s'assombrissent vers une base marine ; ink/muted/faint s'éclaircissent en
       dégradé inverse ; line reste un filet proche du fond ; chaque accent
       sémantique éclaircit sa teinte de base (lisible sur fond sombre) et assombrit
       son -fill/-line en griffe basse de la même teinte. */
    :root[data-theme="dark"] {
      --bg: #0B1220; --surface: #121B2E; --card: #121B2E;
      --ink: #EEF2F8; --muted: #A9B4C4; --faint: #7C8AA0; --line: #263248;
      --blue: #7DA2F5;
      --amber: #FBBF6D; --amber-fill: #2B2210; --amber-line: #4A3A18;
      --teal:  #5FE6D6; --teal-fill:  #0E2A27; --teal-line:  #164E48;
      --green: #7BE0A0; --green-fill: #0F2A1B; --green-line: #1C4A30;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
      font-size: 16px;
    }
    /* Deux largeurs, pas une (regle L2). Le conteneur suit l'ecran — jamais de
       plafond px nu : un max-width fixe tombe sous 75 % de la fenetre sur les
       grands ecrans. La PROSE, elle, reste bornee en ch — une ligne de texte sur
       1680px est illisible. Elargir uniformement remplacerait un defaut par un autre. */
    .wrap { max-width: var(--w); margin: 0 auto; padding: 32px 24px 64px; }

    h1, h2, h3 { font-family: var(--head); font-weight: 800; color: var(--ink); line-height: 1.2; }
    h1 { font-size: 2rem; margin: 0 0 .25em; }
    h2 { font-size: 1.4rem; font-weight: 700; margin: 2em 0 .5em; }
    h3 { font-size: 1.1rem; font-weight: 700; margin: 1.5em 0 .4em; }
    p, li { margin: 0 0 1em; max-width: var(--prose); }
    a { color: var(--blue); }
    code, pre { font-family: var(--mono); }

    header.doc {
      border-bottom: 2px solid var(--blue);
      padding-bottom: 16px; margin-bottom: 24px;
    }
    .eyebrow { color: var(--muted); font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }

    /* S-G1 (3/4, R-30) — bouton de bascule, en-tête, haut à droite */
    .theme-toggle { appearance: none; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink); border-radius: 999px; width: 36px; height: 36px; flex: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; }
    .theme-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px 24px;
      margin: 16px 0;
    }

    footer.doc {
      margin-top: 48px; padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted); font-size: .85rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .wrap { padding: 24px 16px 48px; }
      h1 { font-size: 1.6rem; }
    }

    /* Respect du mouvement réduit (a11y) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    /* Export PDF / impression */
    @page { size: A4; margin: 18mm 16mm; }
    @page :first { margin-top: 22mm; }
    @media print {
      /* S-G1 (2/4 suite, R-30.2) — impression toujours claire, quel que soit le
         thème affiché à l'écran au moment d'imprimer. */
      :root, :root[data-theme="dark"] {
        --bg:#FFFFFF; --surface:#FFFFFF; --card:#FFFFFF; --ink:#0F172A;
        --muted:#64748B; --faint:#94A3B8; --line:#E6EAF2; --blue:#2563EB;
        --amber:#D97706; --amber-fill:#FFFBEB; --amber-line:#FDE9C8;
        --teal:#0E9488;  --teal-fill:#EFFDFB;  --teal-line:#C7F0EA;
        --green:#15803D; --green-fill:#F2FCF5; --green-line:#CFEEDD;
      }
      body { background: #FFFFFF; }
      .wrap { max-width: none; padding: 0; }
      .card { break-inside: avoid; page-break-inside: avoid; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: .85em; color: var(--muted); }
      .theme-toggle { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="doc" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
      <div>
        <p class="eyebrow">Digit-AI · {TypeDoc}</p>
        <h1>{Titre du livrable}</h1>
      </div>
      <!-- S-G1 (3/4, R-30) — bouton de bascule thème sombre -->
      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="Bascule thème sombre" aria-pressed="false">
        <svg class="icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main>
      <section>
        <h2>{Section}</h2>
        <p>{Contenu en balises sémantiques. Décliner les couleurs via les tokens
           <code>:root</code> uniquement, jamais en dur.}</p>

        <div class="card">
          <h3>{Sous-élément}</h3>
          <p>{Carte de contenu — solidaire en PDF grâce à <code>break-inside: avoid</code>.}</p>
        </div>
      </section>
    </main>

    <footer class="doc">
      Digit-AI — {Client} · {Scope} · 2026
    </footer>
  </div>

  <!-- S-G1 (4/4, R-30) — câblage : persistance + aria-pressed, aucune bascule muette -->
  <script>
  (function () {
    var bouton = document.getElementById('theme-toggle');
    var racine = document.documentElement;
    function appliquer(theme) {
      racine.setAttribute('data-theme', theme);
      localStorage.setItem('digitai-theme', theme);
      bouton.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }
    bouton.setAttribute('aria-pressed', racine.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
    bouton.addEventListener('click', function () {
      appliquer(racine.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();
  </script>
</body>
</html>
