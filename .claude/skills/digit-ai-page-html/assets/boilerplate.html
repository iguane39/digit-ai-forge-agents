<!DOCTYPE html>
<html lang="fr">
<head>
<!-- A3 (TF-0303, 17/08) — charset PUIS viewport en TOUTE PREMIÈRE position : la
     déclaration d'encodage doit tomber dans les 1024 premiers octets, sinon l'analyseur
     devine. Le commentaire S-G1 ci-dessous et son script la repoussaient au 1613e octet :
     mesuré par check_html.py, sur ce gabarit même. L'ordre compte, la position aussi. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- S-G1 (1/4, R-30 amendé TF-0158 le 13/08) — initialisation AVANT le <style> : pose
     data-theme avant la première peinture (zéro flash). CLAIR PAR DÉFAUT, STRICTEMENT :
     un livrable circule et s'ouvre identique chez tous ses lecteurs — l'auto-sombre
     hérité de l'OS (prefers-color-scheme) est retiré (il a valu un retour humain réel
     le 13/08 : « thème sombre par défaut »). Le sombre reste un CHOIX du lecteur,
     persisté. Volontairement SANS defer/async : un script différé peindrait d'abord le
     thème par défaut du CSS puis re-peindrait, c'est le flash que ce script évite
     (déclenche le WARN générique « script bloquant en head » de check_html.py —
     exception assumée, documentée ici). -->
<script>
(function () {
  var stocke = null;
  try { stocke = localStorage.getItem('digitai-theme'); } catch (e) {}
  var theme = stocke === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  /* RV-9 (14/08) : `color-scheme` SUIT le thème effectif. Laissé à « light dark », le
     navigateur peignait ses propres surfaces (ascenseurs, contrôles de formulaire) en
     sombre dès que le poste l'était — un corps clair bordé de chrome sombre, alors même
     que la règle dit « clair par défaut ». Le figer à « light » aurait produit l'inverse
     après bascule. Il suit donc, et reste juste dans les deux états. */
  var meta = document.querySelector('meta[name="color-scheme"]');
  if (meta) { meta.setAttribute('content', theme); }
})();
</script>
  <!-- A4 : marque — objet · client — indice de version DATÉ ({YYYYMMDD}{a,b,c…}, le même
       que le nom de fichier). Sans lui, deux révisions du même jour portent le même nom à
       l'écran ; « V1 » ne les distingue pas (défaut du 17/08, lot Produit-01). -->
  <title>Digit-AI — {Objet} · {Client} — 20260817a</title>
  <meta name="description" content="{Résumé clair du livrable en une phrase.}">
  <meta name="theme-color" content="#2563EB">
  <!-- « light » à l'écriture : le script d'initialisation ci-dessus le passe à « dark » si,
       et seulement si, le lecteur a explicitement choisi le sombre (RV-9, 14/08). -->
  <meta name="color-scheme" content="light">
  <!-- Favicon-lettre (systématisation du 13/08, loi transverse n°3 : la surface implicite
       se propose d'office) : remplacer {L} par la PREMIÈRE LETTRE du client ou du projet. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Roboto,sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'%3E{L}%3C/text%3E%3C/svg%3E">

  <!-- Polices : AUCUN chargement réseau (A1/D-10 — confidentialité, durabilité,
       lecture hors ligne). Roboto/DM Sans s'affichent si installées localement,
       sinon les replis système des tokens --head/--sans/--mono prennent le relais. -->

  <style>
    :root {
      /* Couleurs — marque & surfaces */
      --blue: #2563EB;
      --bg: #FAFBFF;
      --surface: #FFFFFF;
      --card: #FFFFFF;
      /* Focus — PRESCRIT par token, consomme par toute affordance (RGAA 10.7, WCAG 2.4.7) :
         un anneau improvise par chaque auteur n'est pas une charte. */
      --focus-anneau: 2px solid var(--blue);
      --focus-decalage: 2px;
      /* Couleurs — encres */
      --ink: #0F172A;
      --muted: #64748B;
      --faint: #94A3B8;
      --line: #E6EAF2;
      /* Accents sémantiques */
      --amber: #D97706; --amber-fill: #FFFBEB; --amber-line: #FDE9C8;
      --teal:  #0E9488; --teal-fill:  #EFFDFB; --teal-line:  #C7F0EA;
      --green: #15803D; --green-fill: #F2FCF5; --green-line: #CFEEDD;
      /* TF-0755 (02/09) : le QUATRIEME registre, employe par les livrables de la maison et
         documente nulle part. Un rapport de conformite qui a eu besoin d'un « refus / non
         declare » ne l'a pas trouve dans le socle et l'a INVENTE — alors que le livrable
         conforme de reference portait deja ces trois valeurs exactes. Une palette dont un
         registre entier n'est ecrit nulle part se fait reinventer, et deux reinventions donnent
         deux rouges dans deux livrables de la meme maison. */
      --red:   #B91C1C; --red-fill:   #FEF2F2; --red-line:   #F6CFCF;
      /* TF-0754 (02/09) : hauteur de l'EN-TETE COLLANT. Le socle a tranche — l'en-tete garde le
         bord haut, le thead collant et le sommaire lateral se decalent de var(--hh). Un token
         consomme sans etre pose vaudrait 0 et ramenerait la collision (controle L29). */
      --hh: 64px;
      /* Rayons */
      --r: 12px; --r-sm: 8px;
      /* Largeur du conteneur et largeur de lecture — cf. regle L2.
         Le conteneur occupe 75-100 % de la fenetre A TOUTE TAILLE (decision 13/08) :
         92vw sous ~1826px, plafond confort 1680px, plancher 75vw au-dela. */
      /* TF-0450 : `--prose: 75ch` retire. Il n'etait plus consomme nulle part depuis que
         TF-0421 a retire la bride `p, li { max-width: var(--prose) }` — un token declare et
         jamais lu n'est pas neutre, c'est la trace visible d'une doctrine abandonnee, en tete
         du fichier que tout auteur de page copie. Le prochain le rebrancherait. */
      --w: clamp(75vw, 1680px, 92vw);
      /* Familles (repli système obligatoire) */
      --head: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "Consolas", monospace;
      /* Année de référence (token isolé) */
      --annee-ref: "2026";
    }

    /* S-G1 (2/4, R-30) — tokens sombres : une source, deux projections. bg/surface
       s'assombrissent vers une base marine ; ink/muted/faint s'éclaircissent en
       dégradé inverse ; line reste un filet proche du fond ; chaque accent
       sémantique éclaircit sa teinte de base (lisible sur fond sombre) et assombrit
       son -fill/-line en griffe basse de la même teinte. */
    :root[data-theme="dark"] {
      --bg: #0B1220; --surface: #121B2E; --card: #121B2E;
      --ink: #EEF2F8; --muted: #A9B4C4; --faint: #7C8AA0; --line: #263248;
      --blue: #7DA2F5;
      --amber: #FBBF6D; --amber-fill: #2B2210; --amber-line: #4A3A18;
      --teal:  #5FE6D6; --teal-fill:  #0E2A27; --teal-line:  #164E48;
      --green: #7BE0A0; --green-fill: #0F2A1B; --green-line: #1C4A30;
      --red:   #F5A3A3; --red-fill:   #2C1416; --red-line:   #4C1F22;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
      font-size: 16px;
    }
    /* TF-0733 (31/08, lot produit) — LE VOILE INVISIBLE AUX SEIZE ORACLES. Un panneau masque
       par l'attribut `hidden` mais style par un `display: flex` explicite : la regle CSS
       l'emporte sur le display:none que l'attribut tient de la feuille de l'agent utilisateur,
       et un rectangle TRANSPARENT couvre l'ecran en interceptant chaque clic — invisible en
       capture (transparent), invisible a la lecture (syntaxiquement correct), trouve par
       document.elementFromPoint. Cette ligne rend l'attribut SOUVERAIN : un composant masque
       le reste, quel que soit le display que sa classe pose. Elle est OBLIGATOIRE de charte
       sur toute page qui emploie `hidden` (controle L23 de check_html.py). */
    [hidden] { display: none !important; }

    /* Regle L2 (corrigee, TF-0421 — lot Produit-05 20260820a) : la mesure de lecture est portee
       par le CONTENEUR, jamais par le paragraphe. L'ancienne doctrine (« conteneur relatif,
       prose bornee en ch ») bridait chaque <p> a 75ch : a 1 800 px, 60 % de la fenetre vide,
       livre vert, refuse par le client. Deux gabarits de chapitre NOMMES remplacent la bride :
         .chap.lire  — un PASSAGE de lecture (~1 080 px centres) INSERE dans une mise en page
                       large — JAMAIS l'enveloppe d'un chapitre entier : employe comme
                       enveloppe, il place tout le document a 56 % d'une fenetre de 1 920 px,
                       sous le plancher de largeur que ce squelette enonce, et render_page L2
                       le refuse a bon droit (TF-0724 D2, constate par le destinataire humain) ;
         .chap.duo   — grille 7/5 texte + encart utile (KPI, legende, figure), repli < 1 100 px.
       Un <p> seul sur une largeur de 1 680 px reste illisible : c'est le CHAPITRE qu'on
       retrecit (.chap.lire), pas la ligne. render_page.py L2 juge quelle que soit la propriete. */
    .wrap { max-width: var(--w); margin: 0 auto; padding: 32px 24px 64px; }
    .chap.lire { max-width: 1080px; margin-left: auto; margin-right: auto; }
    .chap.duo { display: grid; grid-template-columns: 7fr 5fr; gap: 32px; align-items: start; }
    @media (max-width: 1100px) { .chap.duo { grid-template-columns: 1fr; } }

    /* ── Tableaux, et leur repli en cartes (TF-0442, composants.md §6) ──────────────────
       Le socle ne portait AUCUN style de tableau : chaque page en reinventait, et le repli en
       cartes — seule parade reelle au debordement — n'existait qu'en exemple dans un
       referentiel. Mesure du 21/08 sur une page dont TOUS les tableaux etaient deja dans un
       conteneur `overflow-x: auto` : 26 defauts V1 BLOQUANTS a 390 px (25 causes, 935
       elements), 4 a 768 px, et ZERO apres repli. Un conteneur qui defile rend un tableau
       CONSULTABLE ; il ne le rend pas lisible et ne fait pas passer V1, qui compare le bord
       droit au viewport sans regarder si un ancetre defile.

       Seuil a 900 px et non 640 : le calibrage de composants.md (~130 px de largeur utile par
       colonne de prose) place le repli d'un tableau de 4 colonnes textuelles au-dessus de
       640 px. Verifie au rendu sur le squelette de rapport de donnees du pilot — PASS a
       1280 / 768 / 390.

       `thead { display: none }` et non un masquage hors ecran : la version « position
       absolue + clip » a ete essayee D'ABORD et REFUSEE par render_page — les `<th>` gardent
       leur largeur naturelle et debordent (3 BLOQUANTS mesures a 390 px). Le libelle de colonne
       n'est pas perdu, il est rendu par `td::before` depuis `data-label`.

       Chaque `<td>` porte `data-label="<en-tete de sa colonne>"`. Un tableau qui n'en porte
       pas ne se replie pas — c'est voulu : le repli sans etiquette rendrait des valeurs nues. */
    .table-hote { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; color: var(--muted); font-size: .85rem; padding: 8px 0; }
    /* TF-0724 D1 (31/08, lot produit) — `overflow-wrap: anywhere` NE VIT PLUS sur `th, td` :
       pose la, la coupure s'appliquait a TOUTE cellule de prose, et L19 — le controle qui
       accompagne ce squelette — refusait precisement cela. Tout document bati sur le socle et
       portant un tableau de texte echouait SANS QUE SON AUTEUR AIT RIEN ECRIT (deux echecs
       mesures sur un livrable, imputables au seul CSS du socle ; la surcharge ne suffisait
       pas, l'oracle lisant la declaration et non la cascade). La coupure vit desormais aux
       DEUX seuls endroits legitimes : le repli en cartes (composants.md §6, palier oblige,
       tolere par L19 depuis TF-0554) et la classe explicite `.cellule-code` pour les cellules
       d'identifiants techniques — une classe qui DIT son usage, comme L19 le demande. */
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-family: var(--head); font-weight: 700; }
    td.cellule-code, th.cellule-code { font-family: var(--mono); overflow-wrap: anywhere; }
    @media (max-width: 900px) {
      .table-hote { overflow-x: visible; }
      table.repli-cartes thead { display: none; }
      table.repli-cartes tr { display: block; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px; break-inside: avoid; }
      table.repli-cartes td { display: grid; grid-template-columns: minmax(9ch, 38%) 1fr; gap: 8px; border: 0; padding: 4px 0; }
      table.repli-cartes td::before { content: attr(data-label); font-weight: 700; color: var(--muted); }
      table.repli-cartes td:not([data-label])::before { content: none; }
    }

    h1, h2, h3, h4 { font-family: var(--head); font-weight: 800; color: var(--ink); line-height: 1.2; }
    h1 { font-size: 2rem; margin: 0 0 .25em; }
    h2 { font-size: 1.4rem; font-weight: 700; margin: 2em 0 .5em; }
    h3 { font-size: 1.1rem; font-weight: 700; margin: 1.5em 0 .4em; }
    /* TF-0724 D3 : le socle s'arretait a h3 — un document au quatrieme niveau devait le styler
       lui-meme, et declenchait « saut de hierarchie » s'il n'intercalait pas un h3. Le niveau 4
       existe ; au-dela, c'est un composant, pas un titre. */
    h4 { font-size: 1rem; font-weight: 700; margin: 1.2em 0 .3em; }
    p, li { margin: 0 0 1em; }
    a { color: var(--blue); }
    code, pre { font-family: var(--mono); }

    header.doc {
      border-bottom: 2px solid var(--blue);
      padding-bottom: 16px; margin-bottom: 24px;
    }
    /* ── B1 contre B6 : l'ARBITRAGE, en deux lignes (TF-0754, 02/09) ──────────────────
       « header sticky » et « thead sticky » se superposaient sur toute page longue a
       tableaux : le thead se collait au bord haut DERRIERE l'en-tete et devenait illisible,
       ou bien on lui donnait un decalage au jugé et il flottait au-dessus des premieres
       lignes de son propre tableau. Aucun des deux textes du socle ne disait lequel cede, ni
       ne fournissait le decalage — un PRODUIT a fini par trancher, apres deux cycles de
       rendu. L'en-tete garde le bord haut (c'est lui qui porte l'identite du livrable) ; ce
       qui colle SOUS lui consomme --hh. Le sommaire lateral (L25) prend le meme repere. */
    header.doc.colle { position: sticky; top: 0; z-index: 20; background: var(--bg); }
    thead.colle th   { position: sticky; top: var(--hh); z-index: 10; background: var(--surface); }
    nav.toc.colle    { position: sticky; top: var(--hh); z-index: 10; }
    @media (max-width: 900px) { nav.toc.colle { position: static; } }
    .eyebrow { color: var(--muted); font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }

    /* S-G1 (3/4, R-30) — bouton de bascule, en-tête, haut à droite */
    .theme-toggle { appearance: none; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink); border-radius: 999px; width: 36px; height: 36px; flex: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; }
    .theme-toggle:focus-visible { outline: var(--focus-anneau); outline-offset: var(--focus-decalage); }
    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px 24px;
      margin: 16px 0;
    }

    footer.doc {
      margin-top: 48px; padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted); font-size: .85rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .wrap { padding: 24px 16px 48px; }
      h1 { font-size: 1.6rem; }
    }

    /* Respect du mouvement réduit (a11y) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    /* Export PDF / impression */
    @page { size: A4; margin: 18mm 16mm; }
    @page :first { margin-top: 22mm; }
    @media print {
      /* S-G1 (2/4 suite, R-30.2) — impression toujours claire, quel que soit le
         thème affiché à l'écran au moment d'imprimer. */
      :root, :root[data-theme="dark"] {
        --bg:#FFFFFF; --surface:#FFFFFF; --card:#FFFFFF; --ink:#0F172A;
        --muted:#64748B; --faint:#94A3B8; --line:#E6EAF2; --blue:#2563EB;
        --amber:#D97706; --amber-fill:#FFFBEB; --amber-line:#FDE9C8;
        --teal:#0E9488;  --teal-fill:#EFFDFB;  --teal-line:#C7F0EA;
        --green:#15803D; --green-fill:#F2FCF5; --green-line:#CFEEDD;
        --red:#B91C1C;   --red-fill:#FEF2F2;    --red-line:#F6CFCF;
      }
      body { background: var(--surface); }
      .wrap { max-width: none; padding: 0; }
      .card { break-inside: avoid; page-break-inside: avoid; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: .85em; color: var(--muted); }
      .theme-toggle { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="doc" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
      <div>
        <p class="eyebrow">Digit-AI · {TypeDoc}</p>
        <h1>{Titre du livrable}</h1>
      </div>
      <!-- S-G1 (3/4, R-30) — bouton de bascule thème sombre -->
      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="Bascule thème sombre" aria-pressed="false">
        <svg class="icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main>
      <section>
        <h2>{Section}</h2>
        <p>{Contenu en balises sémantiques. Décliner les couleurs via les tokens
           <code>:root</code> uniquement, jamais en dur.}</p>

        <div class="card">
          <h3>{Sous-élément}</h3>
          <p>{Carte de contenu — solidaire en PDF grâce à <code>break-inside: avoid</code>.}</p>
        </div>
      </section>
    </main>

    <footer class="doc">
      Digit-AI — {Client} · {Scope} · 2026
    </footer>
  </div>

  <!-- S-G1 (4/4, R-30) — câblage : persistance + aria-pressed, aucune bascule muette -->
  <script>
  (function () {
    var bouton = document.getElementById('theme-toggle');
    var racine = document.documentElement;
    function appliquer(theme) {
      racine.setAttribute('data-theme', theme);
      localStorage.setItem('digitai-theme', theme);
      bouton.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }
    bouton.setAttribute('aria-pressed', racine.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
    bouton.addEventListener('click', function () {
      appliquer(racine.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();
  </script>
</body>
</html>
