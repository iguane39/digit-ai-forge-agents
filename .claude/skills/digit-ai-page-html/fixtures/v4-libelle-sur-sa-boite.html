<title>Digit-AI — V4 — libelle de fleche sur la boite qu il annote — 20260916a</title>
<!--
  Fixture de TF-1146 — LE SENS VERT : l exemption par PAIRE DECLAREE exempte bien ce qu elle
  declare, et elle seule.

  Meme fichier que `v4-libelle-dans-la-boite-voisine.html` a une coordonnee pres : le libelle est
  peint SUR la couche qu il declare annoter. Un libelle pose sur sa boite la recouvre par
  construction — sans exemption, V4 crierait sur chaque boite de chaque schema. Attendu : AUCUN
  constat v4_overlap. Sans cette contre-epreuve, apparier l exemption aurait pu la rendre
  inoperante et remettre un bruit de fond sur tous les schemas du parc.
-->
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#CBD5E1;--sans:"DM Sans",system-ui,sans-serif}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff}
main{max-width:70ch;margin:0 auto;padding:24px}
@media print{body{background:#fff}}
</style></head>
<body><main>
<h1>V4 — un libelle de fleche appartient a l element qu il annote</h1>
<p>Le libelle ci-dessous declare annoter la couche du bas, et il y est peint.</p>
<svg width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="Trois couches et le libelle de leur relation">
  <rect id="couche-haut" x="20" y="20" width="480" height="90" rx="8" fill="#F1F5F9" stroke="#CBD5E1"></rect>
  <rect id="couche-bas" x="20" y="160" width="480" height="90" rx="8" fill="#F1F5F9" stroke="#CBD5E1"></rect>
  <text data-overlap-ok="couche-bas" x="40" y="215" font-family="DM Sans, sans-serif" font-size="14" fill="#475569">expose ses sorties a</text>
</svg>
</main></body></html>
