<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — cartes filtrantes, perimetre par tableau — 20260914a</title>
<style>
:root{--ink:#0F172A;--muted:#64748B;--line:#E6EAF2;--surface:#FFFFFF;
 --head:"Roboto",system-ui,sans-serif;--sans:"DM Sans",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans);font-size:15px;color:var(--ink)}
.wrap{max-width:var(--w);margin:0 auto;padding:20px}
table{width:100%;border-collapse:collapse;margin:0 0 24px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff} tr[hidden]{display:table-row}}
</style></head>
<!--
  Banc du composant de cartes filtrantes (TF-0970, 08/09/2026) — UNE CARTE NE FILTRE QUE LE
  TABLEAU QU'ELLE DESIGNE.

  Deux tableaux, deux groupes de cartes, et surtout DEUX ATTRIBUTS : les cartes du mapping filtrent
  sur `data-statut`, celles des mesures sur `data-type`, et les lignes des mesures ne portent pas
  `data-statut`. C'est la condition qui a revele le defaut sur un livrable : tant que tous les
  tableaux partageaient le meme attribut, appliquer la carte active a tous restait presque juste.

  Aucun composant n'est embarque ici : le banc (self_test.py, run_kpi_perimetre) injecte la SOURCE
  du composant, puis sa reproduction d'avant correctif (kpi-filter-avant-tf0970.js), et compte
  les lignes vues de chaque tableau apres chaque clic.
-->
<body><main class="wrap">
<h1>Banc des cartes filtrantes</h1>
<div class="kpis">
<button type="button" id="k-corriger" data-kpi-filtre data-kpi-table="t-map" data-kpi-attr="statut"
  data-kpi-valeur="corriger" aria-pressed="false">A corriger</button>
</div>
<table id="t-map">
<thead><tr><th>Colonne servie</th><th>Statut</th></tr></thead>
<tbody>
<tr data-statut="corriger"><td>lot_surface</td><td>corriger</td></tr>
<tr data-statut="corriger"><td>bail_debut</td><td>corriger</td></tr>
<tr data-statut="corriger"><td>loyer_ht</td><td>corriger</td></tr>
<tr data-statut="ok"><td>lot_cle</td><td>ok</td></tr>
<tr data-statut="ok"><td>bail_fin</td><td>ok</td></tr>
<tr data-statut="ok"><td>charge</td><td>ok</td></tr>
<tr data-statut="ok"><td>indexation</td><td>ok</td></tr>
<tr data-statut="ok"><td>depot</td><td>ok</td></tr>
</tbody></table>
<div class="kpis">
<button type="button" id="k-dax" data-kpi-filtre data-kpi-table="t-mes" data-kpi-attr="type"
  data-kpi-valeur="dax" aria-pressed="false">Mesures calculees</button>
</div>
<table id="t-mes">
<thead><tr><th>Mesure</th><th>Type</th></tr></thead>
<tbody>
<tr data-type="dax"><td>Loyer annuel</td><td>dax</td></tr>
<tr data-type="dax"><td>Taux d occupation</td><td>dax</td></tr>
<tr data-type="dax"><td>Dette cumulee</td><td>dax</td></tr>
<tr data-type="dax"><td>Echeance moyenne</td><td>dax</td></tr>
<tr data-type="colonne"><td>Surface</td><td>colonne</td></tr>
<tr data-type="colonne"><td>Lot</td><td>colonne</td></tr>
</tbody></table>
</main></body></html>
