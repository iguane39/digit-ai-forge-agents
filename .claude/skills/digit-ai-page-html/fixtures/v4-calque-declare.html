<!--
  Fixture de TF-1281 (lot Produit-64 20260921a, retour RD-13) — UN CALQUE NE SE DECLARE PAS PAR

  cela. La forme par paire obligeait a donner un id a chaque trait et a lister dans chacun les N-1
  autres (400 declarations pour une figure de 20 traits). Deux elements qui declarent le MEME

  pose sur le passage des traits sans declarer le jeton : il reste un constat.
-->
