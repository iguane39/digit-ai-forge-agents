<!--

  LE FAIT : aucun en-tete de la console livree n'etait defini, et l'infobulle disait « Trier
  par ». Une hypothese exprimee EN EUROS PAR AN etait consommee par « sejours x valeur »,
  c'est-a-dire multipliee par un nombre d'occurrences : personne ne pouvait le voir, et
  l'oracle Calculs rendait SKIP faute de savoir ce que la colonne mesurait. Une unite qui n'est
  ecrite nulle part se fait deviner, et une devinette ne se relit pas.

  Attendu : L27 et elle seule.
-->
