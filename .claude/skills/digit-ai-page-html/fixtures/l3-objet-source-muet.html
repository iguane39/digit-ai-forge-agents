<!--
  Fixture ROUGE de L3 ter — l'OBJET NOMME QUE PERSONNE N'EXPLIQUE (TF-0934, 08/09).

  Le cas mesure sur le livrable du lendemain de L3 bis : la colonne cite les objets d'un
  entrepot HERITE, cite mais jamais joint. Aucun catalogue ne les commente, alors le generateur
  fait retomber l'infobulle sur la DEFINITION DE LA COLONNE — la meme phrase sur toutes les
  cellules, qui se lit « pas d'explication ».

  Ni L3 bis ni L27 ne le voient : l'infobulle ne recopie pas la cellule (elle recopie l'en-tete),
  et la colonne a bien sa definition. Le trou est entre les deux.

  Attendu : L3.
-->
