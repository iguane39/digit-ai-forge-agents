<!-- Fixture A4 ROUGE (TF-0303) — le manque ISOLÉ : la marque et l'objet sont là, l'indice

     porteraient le même nom à l'écran — exactement ce que le nommage socle
     ({YYYYMMDD}{a,b,c…}) évite côté fichier. La verte correspondante est
     a1-fragment-corrige.html, dont le titre porte les deux composantes. -->
<title>Digit-AI — Écarts de périmètre · Approval</title>

:root[data-theme="dark"] { --bg: #0B1220; --ink: #EEF2F8; --line: #263248; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--bg); }
