<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — L1 ponctuation orpheline</title>
<style>
:root{--ink:#0F172A;--mark:#FEF08A;--faint:#64748B;
 --head:"Roboto",system-ui,sans-serif;--sans:"DM Sans",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans)}
.wrap{max-width:var(--w);margin:0 auto;padding:20px}
mark.find{background:var(--mark);color:inherit;padding:0;margin:0;display:inline}
/* Le nom du noeud a ete passe en bloc pour lui donner sa ligne. La phrase qui
   l'entourait n'a pas ete rearticulee : son point reste derriere l'element et
   ouvre desormais la ligne suivante. */
.bl-n{display:block;font-weight:600}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff}}
</style></head>
<body><main class="wrap">
<h1>L1 — une ligne qui s'ouvre sur une ponctuation</h1>
<p><b>Le blocage principal</b> — <span class="bl-n">Optimisation / Pages A Fusionner
(noeud 74)</span>. La fusion a operer n'est pas un nettoyage marginal : elle porte sur
57 % des pages du site.</p>
</main></body></html>
