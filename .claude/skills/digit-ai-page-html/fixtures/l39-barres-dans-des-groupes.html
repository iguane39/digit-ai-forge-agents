<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — Digit-AI — L39 barres écrites à la main sous des groupes translatés — 20261018a</title>
<style>
:root{--ink:#0F172A;--muted:#64748B;--line:#E6EAF2;--s1:#2563EB;--s2:#D97706;
 --head:"Roboto",system-ui,sans-serif;--sans:"DM Sans",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans);font-size:15px;color:var(--ink)}
.wrap{max-width:var(--w);margin:0 auto;padding:20px}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff}}
</style></head>
<!--
  Fixture ROUGE de L39 (TF-1857) — le même graphique, mais chaque colonne est un groupe
  `<g transform="translate(x,0)">` et ses <rect> portent x="0" : vus de l'intérieur, tous sont
  alignés au même endroit. La mesure cumule les `translate()` entre le rectangle et son <svg> ;
  sans cela, la forme la plus fréquente d'un graphique généré passerait sans bruit.

  Attendu : un avertissement L39 « graphique en barres », aucun échec L.
-->
<body><main class="wrap">
<h1>Dépense par jour et par pays</h1>
<p>Dépense en euros du lundi au samedi, empilée par pays : France en bleu, Italie en orange.</p>
<svg width="280" height="146" viewBox="0 0 280 146" role="img" aria-label="Dépense par jour et par pays, en euros">
  <g transform="translate(30,0)"><rect x="0" y="60" width="28" height="60" fill="#2563EB"></rect><rect x="0" y="40" width="28" height="20" fill="#D97706"></rect></g>
  <g transform="translate(70,0)"><rect x="0" y="68" width="28" height="52" fill="#2563EB"></rect><rect x="0" y="42" width="28" height="26" fill="#D97706"></rect></g>
  <g transform="translate(110,0)"><rect x="0" y="50" width="28" height="70" fill="#2563EB"></rect><rect x="0" y="38" width="28" height="12" fill="#D97706"></rect></g>
  <g transform="translate(150,0)"><rect x="0" y="75" width="28" height="45" fill="#2563EB"></rect><rect x="0" y="45" width="28" height="30" fill="#D97706"></rect></g>
  <g transform="translate(190,0)"><rect x="0" y="54" width="28" height="66" fill="#2563EB"></rect><rect x="0" y="36" width="28" height="18" fill="#D97706"></rect></g>
  <g transform="translate(230,0)"><rect x="0" y="82" width="28" height="38" fill="#2563EB"></rect><rect x="0" y="60" width="28" height="22" fill="#D97706"></rect></g>
  <text x="44" y="134" text-anchor="middle" font-size="11">Lun</text>
  <text x="84" y="134" text-anchor="middle" font-size="11">Mar</text>
  <text x="124" y="134" text-anchor="middle" font-size="11">Mer</text>
  <text x="164" y="134" text-anchor="middle" font-size="11">Jeu</text>
  <text x="204" y="134" text-anchor="middle" font-size="11">Ven</text>
  <text x="244" y="134" text-anchor="middle" font-size="11">Sam</text>
</svg>
</main></body></html>
