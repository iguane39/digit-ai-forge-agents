<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — matrice d etats — tableau dans un onglet masque, « Aucun » qui ANNONCE — 20261013a</title>
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#E6EAF2;--surface:#FFFFFF;--accent:#2563EB;
 --danger:#B91C1C;--mark:#FEF08A;--sans:"Inter",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface)}
.wrap{max-width:var(--w);margin:0 auto;padding:20px}
mark.find{background:var(--mark);color:inherit;padding:0;margin:0;display:inline}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{position:relative}
[role=tab]{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
[role=tab][aria-selected=true]{border-color:var(--accent)}
.tf-btn{border:0;background:none;cursor:pointer;font:inherit;color:var(--muted)}
.tf-panel{position:absolute;z-index:10;top:100%;left:0;background:var(--surface);
 border:1px solid var(--line);border-radius:6px;padding:8px;min-width:180px}
.tf-panel[hidden]{display:none}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff}}
</style></head>
<!--
  TF-1618 (RA-1), sens VERT. Le tableau filtrable vit dans le SECOND onglet, masque a l arrivee.
  Son composant ANNONCE l etat vide (meme forme que mat-aucun-annonce). Avant TF-1618, l etat
  « filtre-sans-resultat » actionnait le declencheur MASQUE : le message existait, invisible, et
  l etat etait declare MUET. Attendu : etat joue (onglet ouvert d abord), 0 constat etat_muet.
-->
<body><main class="wrap">
<h1>Lots livres</h1>
<div role="tablist" aria-label="Vues">
  <button role="tab" id="o1" aria-selected="true" aria-controls="p1" type="button">Synthese</button>
  <button role="tab" id="o2" aria-selected="false" aria-controls="p2" type="button">Detail des lots</button>
</div>
<section role="tabpanel" id="p1" aria-labelledby="o1">
  <p>Trois lots sont suivis ; le detail se lit dans le second onglet.</p>
</section>
<section role="tabpanel" id="p2" aria-labelledby="o2" hidden>
<table id="t"><thead><tr><th>Lot</th><th>Statut</th></tr></thead>
<tbody>
  <tr><td>nord</td><td>livre</td></tr>
  <tr><td>centre</td><td>en cours</td></tr>
  <tr><td>sud</td><td>livre</td></tr>
</tbody></table>
<div id="compte" class="tf-count" data-tf-count-for="t" aria-live="polite"></div>
</section>
<script>
(function () {
  var tabs = document.querySelectorAll('[role=tab]');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function (e) {
      for (var k = 0; k < tabs.length; k++) {
        var on = tabs[k] === e.currentTarget;
        tabs[k].setAttribute('aria-selected', on ? 'true' : 'false');
        document.getElementById(tabs[k].getAttribute('aria-controls')).hidden = !on;
      }
    });
  }
})();
(function () {
  var t = document.getElementById('t');
  var ths = t.querySelectorAll('thead th');
  for (var i = 0; i < ths.length; i++) {
    (function (th) {
      var b = document.createElement('button');
      b.className = 'tf-btn'; b.type = 'button'; b.setAttribute('aria-expanded', 'false');
      b.textContent = ' ›';
      var p = document.createElement('div');
      p.className = 'tf-panel'; p.hidden = true;
      var aucun = document.createElement('button');
      aucun.className = 'tf-none'; aucun.type = 'button'; aucun.textContent = 'Aucun';
      aucun.addEventListener('click', function () {
        var trs = t.querySelectorAll('tbody tr');
        for (var k = 0; k < trs.length; k++) trs[k].setAttribute('data-tf-hidden', '');
        for (var k2 = 0; k2 < trs.length; k2++) trs[k2].style.display = 'none';
        var c = document.getElementById('compte');
        c.className = 'tf-count zero';
        c.textContent = 'Aucune ligne ne correspond au filtre — rouvrir le panneau et cliquer sur « Tous » pour tout revoir.';
      });
      var tous = document.createElement('button');
      tous.className = 'tf-all'; tous.type = 'button'; tous.textContent = 'Tous';
      p.appendChild(tous); p.appendChild(aucun);
      var opt = document.createElement('label');
      opt.className = 'tf-opt'; opt.textContent = 'livre';
      p.appendChild(opt);
      b.addEventListener('click', function () {
        p.hidden = !p.hidden;
        b.setAttribute('aria-expanded', p.hidden ? 'false' : 'true');
      });
      th.appendChild(b); th.appendChild(p);
    })(ths[i]);
  }
})();
</script>
</main></body></html>
