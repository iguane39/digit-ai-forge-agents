<!-- Fixture A4 ROUGE (TF-0303) — le titre du livrable Produit-01 du 17/08, VERBATIM.
     « Écarts Cartavia V1 » : un seul bloc, sans séparateur, donc sans marque distinguée de
     l'objet, et sans indice de version daté — « V1 » ne distingue pas deux révisions du
     même jour. Tout le reste de la page est conforme : seule A4 doit parler ici, deux fois
     (sans marque, sans version), parce que les deux manques ne se corrigent pas du même
     geste. Motif attendu : « {Marque} — {Objet} · {Client} — {YYYYMMDD}{a,b,c…} ». -->
<title>Écarts Cartavia V1</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Roboto,sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root { --head: "Roboto", system-ui, sans-serif; --sans: "DM Sans", system-ui, sans-serif;
  --ink: #0F172A; --bg: #FAFBFF; --line: #E6EAF2; }
:root[data-theme="dark"] { --bg: #0B1220; --ink: #EEF2F8; --line: #263248; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--bg); }
.wrap { max-width: clamp(75vw, 1680px, 92vw); margin: 0 auto; padding: 24px; }
@media (max-width: 640px) { .wrap { padding: 12px; } }
@media print { body { background: #fff; } }
</style>
</head>
<body>
<main class="wrap">
<h1>Écarts de périmètre relevés sur le cahier des charges</h1>
<p>Enregistré en favori, imprimé en pied de page ou reçu en pièce jointe, ce document ne
dit ni de qui il vient ni de quand il date.</p>
</main>
</body>
</html>
