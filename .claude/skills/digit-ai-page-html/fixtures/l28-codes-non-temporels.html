<!--
  Fixture L28 VERTE (TF-1677, revue forge-design du 14/10/2026).

  Une colonne de CODES dont l'en-tete porte le mot « date » comme un verbe, et dont les cellules
  ressemblent a du temps sans en etre : un numero de version (« 1.2 »), un decimal (« 3.5 »), un
  code de palier (« T3 », « S2 », « Q1 ») et des sigles de trois lettres (« mar », « dec »). La
  premiere ecriture de la garde de TF-1677 les lisait comme des dates et accusait la colonne.

  Attendu : aucune regle. La jumelle `l28-abreviations-datees.html` porte les memes formes
  accompagnees de leur quantieme ou de leur annee : elle doit rester rouge sur L28.
-->
<body><main class="wrap" data-page="donnees">
<h1>Paliers de la regle</h1>
<p>Chaque ligne dit quel code date la regle dans le referentiel des paliers.</p>

</tr></thead>
