<title>Digit-AI — navigation en bandeau, conteneur bride — 20261123e</title>
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#E6EAF2;--surface:#FFFFFF;
 --head:"Montserrat",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
body{margin:0;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--surface)}
nav{display:flex;gap:20px;padding:12px 24px;border-bottom:1px solid var(--line)}
nav a{color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
@media print{body{background:#fff}}
</style></head>
<!--
  TF-2776 (D-235 (a)), CONTRE-EPREUVE : seule une navigation LATERALE sort de la mesure.

  Une navigation `nav` declaree, mais en BANDEAU au-dessus du contenu : elle ne partage la hauteur d'aucun bloc de la
  page, elle n'est pas a cote du conteneur, elle ne retire donc aucune largeur a la fenetre. Le `.wrap` plafonne a
  1 100 px dans une fenetre de 1 440 (76 %, plancher 96 %) reste accuse, comme avant : declarer une navigation
  n'est pas une dispense de pleine largeur.

  Attendu a 1 440 px : 1 conteneur_bride_donnees (avant : 1).
-->
