<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — en-tete reserve au lecteur d'ecran — 20261015a</title>
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#E6EAF2;--surface:#FFFFFF;--bg:#FAFBFF;--blue:#2563EB;
 --r-sm:6px;--mark:#FEF08A;--head:"Montserrat",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface)}
.wrap{margin:0 auto;padding:24px;max-width:960px}
mark.find{background:var(--mark);color:inherit;padding:0;margin:0;display:inline}
table{border-collapse:collapse;width:100%;margin-bottom:24px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
td.actions{text-align:right}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff}}
</style></head>
<!--
  TF-1800 (lot Produit-83 20261015b, RA-6), sens VERT. Une colonne d'actions sans libelle VISIBLE :
  son en-tete n'existe que pour le lecteur d'ecran (motif visually-hidden, boite de 1 px rognee).
  render_page mesurait la position de ce texte de 1 px contre les boutons alignes a droite et
  rendait « libelle d'en-tete decale de 176px ». Un libelle que l'oeil ne voit pas ne se desaligne
  de rien. Deux formes : le texte masque dans le <th>, et le <th> masque lui-meme.
  Attendu : 0 constat entete_desaligne. Le sens rouge reste entete-desaligne.html.
-->
<body><main class="wrap">
<h1>Demandes en attente</h1>
<table id="demandes"><thead><tr><th>Demande</th><th>Etat</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
<tbody>
<tr><td>Ouverture de compte</td><td>A valider</td><td class="actions"><button type="button">Valider</button></td></tr>
<tr><td>Changement d adresse</td><td>A valider</td><td class="actions"><button type="button">Valider</button></td></tr>
</tbody></table>
<table id="relances"><thead><tr><th>Relance</th><th>Echeance</th><th class="visually-hidden">Actions</th></tr></thead>
<tbody>
<tr><td>Piece manquante</td><td>18 octobre</td><td class="actions"><button type="button">Relancer</button></td></tr>
<tr><td>Signature attendue</td><td>21 octobre</td><td class="actions"><button type="button">Relancer</button></td></tr>
</tbody></table>
</main></body></html>
