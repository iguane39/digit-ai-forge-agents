<!--
  TF-1969 (RT-18, lot Produit-84 20261019e), sens ROUGE. Des codes de regle ecrits en lettres puis
  chiffres, sans espace, cites NUS dans la prose et dans une cellule : ADR0501, OSP0901 et GDE0202-R05.
  Aucun ne dit ce qu il impose. L18 ne connaissait que « ADR nnnn » avec espace : la page rendait PASS.
  Les trois mentions de normes (ISO27001, SHA256, HTTP404) ne sont PAS des codes de regle du livrable
  et ne doivent pas etre accusees.
  Attendu : L18 sur ADR0501, OSP0901 et GDE0202-R05, et sur eux seuls.
-->
<body><main class="wrap">
<h1>Decisions d'architecture</h1>
<p>Le cadrage applique ADR0501 pour le deploiement et OSP0901 pour l'ouverture des flux.</p>
<p>Le chiffrement suit ISO27001, l'empreinte SHA256, et une page absente repond HTTP404.</p>

<thead><tr><th>Regle</th><th>Effet</th></tr></thead>
