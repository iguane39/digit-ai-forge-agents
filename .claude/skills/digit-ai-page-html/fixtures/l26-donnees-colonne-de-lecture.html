<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — L26 console bridee en colonne de lecture — 20260902a</title>
<style>
:root{--ink:#0F172A;--muted:#64748B;--line:#E6EAF2;--surface:#FFFFFF;--mark:#FEF08A;
 --head:"Roboto",system-ui,sans-serif;--sans:"DM Sans",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans);font-size:15px;color:var(--ink)}
.wrap{max-width:var(--w);margin:0 auto;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
mark.find{background:var(--mark);color:inherit;padding:0;margin:0;display:inline}
.lecture{max-width:1180px;margin:0 auto}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff}}
</style></head>
<!--
  Fixture L26 ROUGE (TF-0771 + TF-0778, 02/09).

  LE FAIT : une console de donnees livree dans une colonne de lecture de 1 180 px, tableaux
  rognes (V1 mesure a 1 301 px pour 1 136 disponibles a 1 440 px de fenetre) ; la revue a classe
  le debordement « acceptable » parce qu'un conteneur defilait, et le retour humain a ete « les
  pages doivent profiter de toute la largeur de l'ecran ». La cause profonde n'est pas un
  reglage : le socle portait DEUX regles de largeur contradictoires — mesure de lecture pour la
  prose, pleine largeur pour les donnees — sans dire laquelle s'applique ni ou.

  La page DECLARE ce qu'elle est (data-page="donnees") et bride quand meme son conteneur de
  tableau : c'est exactement le cas que L26 refuse.

  Attendu : L26 et elle seule.
-->
<body><main class="wrap" data-page="donnees">
<h1>Console des volumes</h1>
<div class="lecture">
<p>Le tableau vit dans une colonne de lecture de 1 180 px : sur un ecran de 1 920 px, un tiers de la fenetre reste vide et les colonnes se serrent.</p>
<table>
<thead><tr>
<th data-definition="Marche commercial suivi. Source : referentiel interne. Ordre : alphabetique.">Marche</th>
<th data-definition="Volume annuel en nombre de sejours. Unite : sejours/an. Source : mesure 2025.">Volume</th>
<th data-definition="Part du volume total. Unite : pourcentage. Source : calcul derive du volume.">Part</th>
</tr></thead>
<tbody>
<tr><td>Marche A</td><td data-v="1000">1 000</td><td data-v="2.4">2,4 %</td></tr>
<tr><td>Marche B</td><td data-v="12500">12 500</td><td data-v="29.8">29,8 %</td></tr>
<tr><td>Marche C</td><td data-v="250">250</td><td data-v="0.6">0,6 %</td></tr>
<tr><td>Marche D</td><td data-v="45000">45 000</td><td data-v="13.7">13,7 %</td></tr>
</tbody></table>
</div>
</main></body></html>
