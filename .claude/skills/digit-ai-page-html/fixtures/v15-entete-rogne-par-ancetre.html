<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — V15 en-tete rogne par un ancetre — 20261105a</title>
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#E6EAF2;--surface:#FFFFFF;--bg:#FAFBFF;
 --head:"Montserrat",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
body{margin:0;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--bg)}
.wrap{margin:0 auto;padding:24px;max-width:960px}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
/* Le motif « reserve au lecteur d'ecran » pose sur le <thead> : l'ANCETRE des <th> est une boite
   de 1 px a overflow:hidden, les <th> gardent leur taille reelle mais ne se voient pas. */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media print{body{background:#fff}}
</style></head>
<!--
  TF-2170 (lot Produit-84 20261105a), sens VERT de V15. Un tableau dont l'en-tete n'existe que pour
  le lecteur d'ecran : le <thead> est une boite de 1 px a `overflow:hidden`, et chacun de ses <th>
  garde sa taille reelle, rognee par cet ancetre. A l'ecran il n'y a rien a voir, donc rien a
  recouvrir : V15 comptait pourtant un en-tete « pose sur ses lignes » (le <th> rogne se mesure
  sur la premiere ligne du corps) ; le gabarit du produit a du reduire l'en-tete a 1 px pour
  faire taire le constat. Un element rogne par un ancetre dont l'overflow n'est pas `visible`
  n'est pas compte.
  Attendu a 1440 px : 0 `entete_pose_sur_lignes` (le meme document SANS rognage est la fixture
  rouge `v15-entete-pose-non-rogne.html` : 1 constat).
-->
<body><main class="wrap">
<h1>Pieces recues</h1>
<table id="pieces"><thead class="visually-hidden"><tr><th>Piece</th><th>Etat</th><th>Echeance</th></tr></thead>
<tbody>
<tr><td>Justificatif de domicile</td><td>Recu</td><td>18 novembre</td></tr>
<tr><td>Releve d'identite bancaire</td><td>A relancer</td><td>21 novembre</td></tr>
<tr><td>Avis d'imposition</td><td>Recu</td><td>25 novembre</td></tr>
</tbody></table>
</main></body></html>
