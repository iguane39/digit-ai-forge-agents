<!--
  Fixture L28 VERTE (TF-0783, 02/09).

  MEME tableau, MEMES libelles a l'ecran : chaque cellule porte en plus sa valeur d'ordre ISO
  (`data-v="2025-08"`). Le libelle reste lisible par un humain, la valeur reste ordonnable par
  la machine — et une date ISO se compare comme du texte, ce QUI EST deja son ordre
  chronologique. C'est ce que consomment le tri et la facette du composant de filtres (G8).
-->
<body><main class="wrap" data-page="donnees">
<h1>Fenetres d'ouverture</h1>
<p>Chaque mois porte sa valeur d'ordre : la colonne se trie et se facette dans l'ordre du calendrier.</p>
<table>
<thead><tr>
<th data-definition="Marche commercial suivi. Source : referentiel interne. Ordre : alphabetique.">Marche</th>
<th data-definition="Mois d'ouverture de la fenetre. Unite : mois. Source : calendrier evenementiel.">Mois</th>
<th data-definition="Volume annuel en nombre de sejours. Unite : sejours/an. Source : mesure 2025.">Volume</th>
</tr></thead>
<tbody>
<tr><td>Marche A</td><td data-v="2025-08">aout 2025</td><td data-v="1000">1 000</td></tr>
<tr><td>Marche B</td><td data-v="2026-04">avril 2026</td><td data-v="12500">12 500</td></tr>
<tr><td>Marche C</td><td data-v="2025-12">decembre 2025</td><td data-v="250">250</td></tr>
<tr><td>Marche D</td><td data-v="2026-01">janvier 2026</td><td data-v="45000">45 000</td></tr>
</tbody></table>
</main></body></html>
