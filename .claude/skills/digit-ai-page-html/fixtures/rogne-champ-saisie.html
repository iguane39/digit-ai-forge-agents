<!--
  Fixture VERTE de contenu_rogne (TF-0847, 14/09/2026) — UN CHAMP DE SAISIE DEFILE NATIVEMENT.

  Le defaut paye : un <input> dont la valeur depasse sa largeur etait signale ROGNE — la feuille
  du navigateur donne a un champ un overflow masque, donc il entrait dans la boucle — alors que
  le lecteur fait defiler sa valeur au clavier ou a la souris, et que la sonde annoncait
  elle-meme « 0 element de texte invisible ». Le produit avait du passer une adresse en
  <textarea> pour obtenir un vert : un choix de balisage dicte par un defaut d'oracle.

  Meme page que rogne-carte-figee.html, a une declaration pres : ici aucune boite de contenu
  n'est figee. Attendu a 1440 px : 0 constat contenu_rogne.
-->
<body><main class="wrap">
<h1>Fiche de contact</h1>
<p>Les champs ci-dessous portent des valeurs plus longues que leur largeur : elles se lisent en
faisant defiler le champ.</p>
<label for="adresse">Adresse</label>
<input id="adresse" type="text" value="12 avenue de la Grande Armee, batiment C, escalier 4, troisieme etage, porte gauche, 75017 Paris">
<label for="service">Service destinataire</label>
<select id="service"><option>Direction des achats et de la commande publique, service des marches de prestations intellectuelles</option></select>
<div class="carte"><p>Une carte de contenu dont la hauteur suit son texte : rien n'y est perdu.</p>

</main></body></html>
