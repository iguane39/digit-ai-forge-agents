<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — menu a cases deplie, cases de hauteurs inegales — 20261105a</title>
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#E6EAF2;--surface:#FFFFFF;--bg:#FAFBFF;--blue:#2563EB;
 --head:"Montserrat",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
body{margin:0;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;padding:24px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.menu{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 16px;align-items:start}
.cases label{display:flex;align-items:center;gap:8px}
@media print{body{background:#fff}}
</style></head>
<!--
  TF-2162 (lot Produit-86 20261104a, RD-6), sens VERT de la famille `controles_desalignes`. Un menu
  de colonnes DEPLIE (le bouton declare aria-expanded="true" et aria-controls vers le panneau) :
  ses cases sont rangees en grille, les libelles courent sur une a trois lignes, donc les cases
  centrees dans leur libelle tombent a des hauteurs differentes. Ce n'est pas une rangee de
  champs a aligner : 7 constats bloquants sur le produit, levables seulement par
  data-alignement-ok. Les cases d'un panneau ou d'un menu deplie ne sont pas comptees.
  Attendu a 1440 px : 0 `controles_desalignes`. Contre-epreuves : `ctrl-menu-cases-hors-panneau.html`
  (la meme grille hors de tout panneau : au moins 1) et `ctrl-champs-dans-panneau-deplie.html`
  (des champs de saisie dans un panneau deplie : au moins 1).
-->
<body><main class="wrap"><h1>Console des volumes</h1>
<button type="button" id="colonnes" aria-expanded="true" aria-controls="menu-colonnes">Colonnes affichees</button>
<div class="menu" id="menu-colonnes"><div class="cases">
  <label><input type="checkbox" checked> Mandat</label>
  <label><input type="checkbox" checked> Etat du dossier au dernier point de controle du comite de pilotage mensuel</label>
  <label><input type="checkbox"> Echeance</label>
  <label><input type="checkbox" checked> Responsable de la remediation designe par le client</label>
  <label><input type="checkbox"> Volume</label>
  <label><input type="checkbox"> Source</label>
  <label><input type="checkbox"> Perimetre de la derniere extraction validee avec le service et son referent</label>
  <label><input type="checkbox"> Palier</label>
</div></div>
</main></body></html>
