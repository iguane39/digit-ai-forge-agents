<title>Fixture Syne — rouge : la feuille déclare la police — 20260914a</title>

<!-- TF-1049, sens ROUGE. Le jeton de titre déclare la police interdite par la charte, et les
     titres la consomment par var(). La règle doit la trouver dans la feuille, pas dans le texte :
     le corps de la page ne prononce jamais son nom. -->
<style>
:root {
  --head: "Syne", system-ui, sans-serif;
  --sans: "DM Sans", system-ui, sans-serif;
  --ink: #0F172A;
  --muted: #64748B;
  --bg: #FAFBFF;
}
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--bg); }
main { max-width: min(92vw, 1680px); margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-family: var(--head); font-size: 2rem; margin: 0 0 .25em; }
p { margin: 0 0 1em; max-width: 72ch; }
.note { color: var(--muted); font-size: .85rem; }
@media (max-width: 640px) { main { padding: 24px 16px 48px; } }
@media print { body { background: #fff; } .note { color: #000; } }
</style>
</head>
<body>
<main>
<h1>Une police déclarée dans la feuille</h1>
<p>Le titre de cette page est composé dans une police que la charte refuse. Le texte n'en dit
rien : c'est la déclaration qui porte le défaut.</p>
<p class="note">Attendu : échec « Police Syne détectée ».</p>
</main>
</body>
</html>
