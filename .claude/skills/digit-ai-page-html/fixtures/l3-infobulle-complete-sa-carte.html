<style>
:root{--ink:#0F172A;--line:#E6EAF2;--surface:#FFFFFF;--head:"Montserrat",system-ui,sans-serif;
 --sans:"Inter",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans);color:var(--ink)}

<!--

  `l3-infobulle-recopie-sa-carte.html`. Chaque infobulle garde son code et le rappel du texte, mais
  porte AU MOINS UNE LIGNE que la carte ou la ligne n'affiche pas : qui, quand, ce qui en depend.
  Une ligne qui apprend quelque chose suffit — la regle juge ligne par ligne.
  Attendu : aucun avertissement ni echec « L3 infobulle qui RECOPIE sa carte ou sa ligne ».
-->
