<!--
  Fixture de TF-1146 (lot Produit-64 20260916a, retour RD-6) — L EXEMPTION V4 S APPLIQUAIT A L
  ELEMENT, PAS A LA PAIRE.

  Le fait paye : dans le schema des trois couches, le libelle de fleche « expose ses sorties a »
  etait imprime A L INTERIEUR de la boite voisine, sous son sous-titre. Un lecteur y lisait une
  troisieme ligne de legende de la couche, pas le sens d une fleche. Le defaut a traverse DEUX
  livraisons et quatre executions des trois oracles, et a ete trouve en regardant une capture.

  Aucun controle ne pouvait le voir : V1 ne voit rien, le texte est dans le cadre du SVG ; V2 ne
  voit rien, le texte est lisible — c est sa PLACE qui est fausse ; L1 ne voit rien, c est du
  texte SVG hors du modele de prose ; et V4 ne voyait rien parce que le <text> portait
  data-overlap-ok et etait exempte EN BLOC.

  Ici le libelle DECLARE sa paire — il annote la couche du bas — et tombe dans la couche du
  haut. Attendu : un constat v4_overlap, celui que l exemption en bloc avalait. Sa jumelle verte
  est le meme fichier, le libelle pose sur la boite qu il declare.
-->
