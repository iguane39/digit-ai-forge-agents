     Le MÊME commentaire long, la MÊME page, un seul changement : les deux balises meta
     passent avant lui. C'est ce qui prouve que la règle mesure une POSITION et non la
     présence d'un commentaire — sans cette verte, A3 passerait pour un interdit de
     documenter son propre en-tête, ce qui serait absurde dans un socle qui exige des
     commentaires porteurs de provenance.

     Rappel du défaut d'origine : le gabarit du socle déclarait son charset au 1613e octet,
     le commentaire S-G1 et son script d'initialisation de thème le repoussant hors de la
     fenêtre de sniffing des 1024 premiers octets. Mesuré par check_html.py le 17/08 sur
     assets/boilerplate.html, corrigé le même jour par cette remontée exacte. La leçon est
     d'ordre, pas de volume : un socle peut se documenter autant qu'il veut, à condition de
     déclarer d'abord comment se lit ce qu'il écrit.

     Tout le reste est conforme, comme dans la rouge : squelette complet, langue déclarée,
     viewport présent, titre au motif A4 avec son indice daté, favicon-lettre embarqué en
     data: URI, tokens en :root, impression prévue, breakpoint de confort. La règle A3 doit
     rester silencieuse ici, et la famille charte entière avec elle. -->
