<!--
  Fixture ROUGE de L39 (TF-1857, RA-12, Produit-79) — six colonnes de barres empilées en deux séries,
  dessinées à la main dans un <svg> : douze <rect> dont les six du bas partagent la même arête
  (y + height = 120), de même largeur, espacés de 40 unités, de hauteurs toutes différentes. C'est
  la signature d'une série de barres, et le composant « barres empilées » du socle (§ 15 de
  composants.md) la couvre. Le <svg> ne porte ni `.graphe-svg` ni `[data-graphe-empile]`.

  Attendu : un avertissement L39 « graphique en barres », aucun échec L.
-->
