<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit-AI — L32 — marqueur SVG duplique</title>
<style>
:root{--ink:#0F172A;--trait:#334155;--head:"Roboto",system-ui,sans-serif;
 --sans:"DM Sans",system-ui,sans-serif;--w:min(92vw,1680px)}
body{margin:0;font-family:var(--sans);color:var(--ink)}
.wrap{max-width:var(--w);margin:0 auto;padding:20px}
.vue[data-active="non"]{display:none}
@media (max-width:640px){.wrap{padding:10px}}
@media print{body{background:#fff}}
</style></head>
<body><main class="wrap">
<h1>L32 — deux schemas, un seul identifiant de pointe</h1>
<!-- SENS ROUGE (TF-1147) : les deux schemas definissent leur pointe de fleche sous le MEME
     identifiant. Dans un document unique, url(#pointe) resout vers le PREMIER : la seconde vue,
     peinte seule quand elle s affiche, rend un trait nu. Le balisage est correct, l identifiant
     existe, et aucune sonde de rendu ne peut le voir. -->
<section class="vue" data-active="oui">
  <svg viewBox="0 0 200 60" width="200" height="60" role="img">
    <title>Vue une</title>
    <defs><marker id="pointe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#334155"></path></marker></defs>
    <line x1="10" y1="30" x2="180" y2="30" stroke="#334155" stroke-width="2" marker-end="url(#pointe)"></line>
  </svg>
</section>
<section class="vue" data-active="non">
  <svg viewBox="0 0 200 60" width="200" height="60" role="img">
    <title>Vue deux</title>
    <defs><marker id="pointe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#334155"></path></marker></defs>
    <line x1="10" y1="30" x2="180" y2="30" stroke="#334155" stroke-width="2" marker-end="url(#pointe)"></line>
  </svg>
</section>
</main></body></html>
