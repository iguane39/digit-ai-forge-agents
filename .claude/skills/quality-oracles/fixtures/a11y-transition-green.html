<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture verte : le libellé arrive à la fin de la transition</title>
<style>
  /* TF-2313 : une page vivante. Le toast apparaît en fondu (1,2 s) et son bouton reçoit son libellé accessible
     quand le fondu se termine ; le spinner tourne sans fin et ne doit pas retenir l'oracle. */
  .toast { opacity: 0; transition: opacity 1.2s linear; }
  .toast.visible { opacity: 1; }
  .spinner { width: 12px; height: 12px; border: 2px solid #475569; animation: tourne 1s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>Tableau de bord</h1>
<div class="spinner" role="presentation"></div>
<div id="toast" class="toast">Enregistré<button id="fermer" type="button"></button></div>
<script>
  const toast = document.getElementById('toast');
  toast.addEventListener('transitionend', () => document.getElementById('fermer').setAttribute('aria-label', 'Fermer la notification'));
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('visible')));
</script>
</body>
</html>
