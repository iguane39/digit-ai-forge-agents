<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITRE_PAGE}} · Digit-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --bg-softer: #fbfbfc;
    --ink: #0f172a;
    --ink-soft: #334155;
    --ink-muted: #64748b;
    --line: #e2e8f0;
    --line-soft: #eef1f5;
    --line-strong: #cbd5e1;
    --accent: #2563eb;

    --c-purple-bg: #ede9fe;   --c-purple-fg: #5b21b6;   --c-purple-stroke: #c4b5fd;
    --c-blue-bg:   #dbeafe;   --c-blue-fg:   #1d4ed8;   --c-blue-stroke:   #93c5fd;
    --c-teal-bg:   #ccfbf1;   --c-teal-fg:   #0f766e;   --c-teal-stroke:   #5eead4;
    --c-coral-bg:  #fee2e2;   --c-coral-fg:  #b91c1c;   --c-coral-stroke:  #fca5a5;
    --c-amber-bg:  #fef3c7;   --c-amber-fg:  #92400e;   --c-amber-stroke:  #fcd34d;
    --c-gray-bg:   #f1f3f7;   --c-gray-fg:   #374151;   --c-gray-stroke:   #cbd5e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.55; }
  .page { max-width: 1400px; margin: 0 auto; padding: 40px 24px 56px; }

  /* HEADER */
  .header { border-bottom: 1px solid var(--line); padding-bottom: 32px; margin-bottom: 48px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 14px; }
  h1 { font-family: 'Roboto', sans-serif; font-weight: 800; font-size: 42px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 14px; }
  h1 .accent { color: var(--c-purple-fg); }
  .lede { font-family: 'DM Sans', sans-serif; font-size: 18px; color: var(--ink-soft); max-width: 820px; margin-bottom: 24px; }
  .meta { display: flex; flex-wrap: wrap; gap: 28px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-muted); }
  .meta span b { color: var(--ink); font-weight: 700; }

  /* SECTIONS */
  section { margin-bottom: 56px; }
  h2 { font-family: 'Roboto', sans-serif; font-weight: 800; font-size: 26px; color: var(--ink); letter-spacing: -0.015em; margin-bottom: 18px; display: flex; align-items: baseline; gap: 14px; }
  h2 .num { color: var(--c-purple-fg); font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; font-weight: 700; }
  h3 { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); margin: 28px 0 12px; }
  h4 { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
  p { margin-bottom: 12px; color: var(--ink-soft); }
  p.section-intro { color: var(--ink-soft); margin-bottom: 24px; max-width: 820px; }

  /* DIAGRAM WRAP */
  .diagram-wrap { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 28px 20px; overflow-x: auto; margin: 20px 0 12px; position: relative; }
  .diagram-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .caption { font-style: italic; font-size: 13px; color: var(--ink-muted); text-align: center; margin-top: 6px; margin-bottom: 4px; }

  /* SVG STYLES standardisés */
  .svg-th { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 12.5px; fill: var(--ink); }
  .svg-ts { font-family: 'DM Sans', sans-serif; font-size: 10.5px; fill: var(--ink-soft); }
  .svg-tm { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: var(--ink-muted); letter-spacing: 0.06em; }
  .svg-tlabel { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: var(--ink-muted); letter-spacing: 0.04em; }
  .svg-tband { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
  .svg-arr { fill: none; stroke: #475569; stroke-width: 1.5; }
  .svg-arr-strong { fill: none; stroke: var(--ink); stroke-width: 2; }
  .svg-arr-dashed { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
  .svg-arr-ai { fill: none; stroke: #5b21b6; stroke-width: 2; }
  .svg-arr-auto { fill: none; stroke: #1d4ed8; stroke-width: 1.6; }
  .svg-arr-manual { fill: none; stroke: #b45309; stroke-width: 1.8; stroke-dasharray: 5 3; }
  .svg-arr-deliv { fill: none; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 2 3; }
  .svg-c-purple rect { fill: var(--c-purple-bg); stroke: var(--c-purple-stroke); stroke-width: 1.4; }
  .svg-c-purple text { fill: var(--c-purple-fg); }
  .svg-c-blue rect { fill: var(--c-blue-bg); stroke: var(--c-blue-stroke); stroke-width: 1.4; }
  .svg-c-blue text { fill: var(--c-blue-fg); }
  .svg-c-teal rect { fill: var(--c-teal-bg); stroke: var(--c-teal-stroke); stroke-width: 1.4; }
  .svg-c-teal text { fill: var(--c-teal-fg); }
  .svg-c-coral rect { fill: var(--c-coral-bg); stroke: var(--c-coral-stroke); stroke-width: 1.4; }
  .svg-c-coral text { fill: var(--c-coral-fg); }
  .svg-c-amber rect { fill: var(--c-amber-bg); stroke: var(--c-amber-stroke); stroke-width: 1.4; }
  .svg-c-amber text { fill: var(--c-amber-fg); }
  .svg-c-gray rect { fill: var(--c-gray-bg); stroke: var(--c-gray-stroke); stroke-width: 1.4; }
  .svg-c-gray text { fill: var(--c-gray-fg); }
  .svg-agent-mission rect { fill: #ede9fe; stroke: #5b21b6; stroke-width: 1.4; }
  .svg-agent-mission text { fill: #4c1d95; }
  .svg-frame { fill: none; stroke-width: 1.2; stroke-dasharray: 4 4; }

  /* TOOLTIP CUSTOM CARRÉ */
  .nh-tooltip { position: absolute; z-index: 1000; max-width: 360px; min-width: 240px; padding: 12px 14px; background: #1e293b; color: #f1f5f9; border: 1px solid #475569; border-radius: 8px; box-shadow: 0 6px 18px rgba(15,23,42,0.25); font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 1.5; pointer-events: none; opacity: 0; transition: opacity 0.12s ease; }
  .nh-tooltip.visible { opacity: 1; }
  .nh-tooltip .nh-tt-title { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 12.5px; color: #fff; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #475569; letter-spacing: 0.01em; }
  .nh-tooltip ul { list-style: none; margin: 0; padding: 0; }
  .nh-tooltip ul li { position: relative; padding-left: 14px; margin-bottom: 4px; color: #cbd5e1; font-size: 11.5px; }
  .nh-tooltip ul li:last-child { margin-bottom: 0; }
  .nh-tooltip ul li::before { content: ''; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; background: #c4b5fd; border-radius: 50%; }
  .nh-tooltip ul li b { color: #fff; font-weight: 700; }
  .nh-tooltip code { background: #334155; color: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; border: none; }

  /* FOOTER */
  .footer { margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-muted); }
  .footer .brand { font-family: 'Roboto', sans-serif; font-weight: 700; letter-spacing: 0.06em; }

  /* RESPONSIVE */
  @media (max-width: 720px) { .page { padding: 24px 16px 40px; } h1 { font-size: 30px; } h2 { font-size: 22px; } .lede { font-size: 16px; } }

  /* PRINT */
  @media print { .page { padding: 0; max-width: 100%; } body { font-size: 11pt; } .diagram-wrap { background: #fff; break-inside: avoid; } .footer { break-inside: avoid; } }
</style>
</head>

<!-- ============ SCRIPT TOOLTIPS CUSTOM ============ -->
<script>
(function() {
  const tooltip = document.createElement('div');
  tooltip.className = 'nh-tooltip';
  document.body.appendChild(tooltip);

  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatInline(s) {
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9\s/\-]{0,40})\s:\s/, '<b>$1</b> ');
    return s;
  }
  function buildTooltipHtml(rawText) {
    if (!rawText) return '';
    const parts = rawText.split(' | ').map(p => p.trim()).filter(Boolean);
    if (parts.length === 0) return '';
    if (parts.length === 1) {
      const sentences = parts[0].split(/(?<=[.!?])\s+/);
      if (sentences.length > 1) {
        return `<div class="nh-tt-title">${formatInline(sentences[0])}</div><div>${formatInline(sentences.slice(1).join(' '))}</div>`;
      }
      return `<div class="nh-tt-title">${formatInline(parts[0])}</div>`;
    }
    let html = `<div class="nh-tt-title">${formatInline(parts[0])}</div><ul>`;
    parts.slice(1).forEach(b => { html += `<li>${formatInline(b)}</li>`; });
    return html + '</ul>';
  }
  function positionTooltip(e) {
    const rect = tooltip.getBoundingClientRect();
    let x = e.clientX + window.scrollX + 14;
    let y = e.clientY + window.scrollY + 14;
    if (x + rect.width > window.scrollX + window.innerWidth - 12) x = e.clientX + window.scrollX - rect.width - 14;
    if (y + rect.height > window.scrollY + window.innerHeight - 12) y = e.clientY + window.scrollY - rect.height - 14;
    if (x < 8) x = 8;
    if (y < 8) y = 8;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }
  document.querySelectorAll('.diagram-wrap svg g, .diagram-wrap svg line, .diagram-wrap svg path, .diagram-wrap svg rect, .diagram-wrap svg circle').forEach(el => {
    const titleNode = el.querySelector(':scope > title');
    if (!titleNode) return;
    const rawText = titleNode.textContent.trim();
    if (!rawText) return;
    let savedTitle = null;
    el.style.cursor = 'help';
    el.addEventListener('mouseenter', (e) => {
      savedTitle = titleNode.textContent;
      titleNode.textContent = '';
      tooltip.innerHTML = buildTooltipHtml(savedTitle);
      tooltip.classList.add('visible');
      positionTooltip(e);
    });
    el.addEventListener('mousemove', positionTooltip);
    el.addEventListener('mouseleave', () => {
      tooltip.classList.remove('visible');
      if (savedTitle !== null) { titleNode.textContent = savedTitle; savedTitle = null; }
    });
  });
})();
</script>
